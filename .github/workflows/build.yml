name: Build QCACLD3 WLAN module

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  build:
    name: Build QCACLD3 wlan.ko
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: >
            azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable
            firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*
          remove_packages_one_command: true
          remove_folders: >
            /usr/share/swift /usr/share/miniconda /usr/share/az*
            /usr/local/lib/node_modules /usr/local/share/chromium
            /usr/local/share/powershell /usr/local/julia
            /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle
          rm_cmd: rmz
          rmz_version: "3.1.1"
          testing: false

      - name: Set up swap
        run: |
          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bc bison flex libssl-dev libelf-dev \
            python3-pip unzip git patch coreutils curl perl \
            build-essential cpio wget zip

      - name: Download Samsung source and toolchain
        env:
          SRC_ID: "1bdcORqw9c05eGFMFo6nCrfgwcHXDiMN7"
          TC_ID: "1alFYynwVbV5YH6DZf30jmi0tHSZ2EmPw"
        run: |
          pip install -q -U gdown

          dl() {
            local id="$1" out="$2"
            for attempt in 1 2 3; do
              if gdown "$id" -O "$out"; then
                return 0
              fi
              echo "Download attempt $attempt failed for $out; retrying in 60 seconds"
              sleep 60
            done
            echo "Failed to download $out after 3 attempts"
            return 1
          }

          dl "$SRC_ID" samsung.zip
          dl "$TC_ID" toolchain.tar.gz

          unzip -q samsung.zip
          tar -xf Kernel.tar.gz
          tar -xf Platform.tar.gz
          rm samsung.zip Kernel.tar.gz Platform.tar.gz
          tar -xzf toolchain.tar.gz -C kernel_platform/
          rm toolchain.tar.gz

          test -d vendor/qcom/opensource/wlan/qcacld-3.0
          test -d vendor/qcom/opensource/wlan/qca-wifi-host-cmn
          test -f build_kernel_GKI.sh

      - name: Build QCACLD3 module
        run: |
          sed -i 's/BUILD_TARGET=q4q_kor_singlex/BUILD_TARGET=q4q_eur_openx/' \
            build_kernel_GKI.sh

          python3 - <<'PY'
          from pathlib import Path

          path = Path("build_kernel_GKI.sh")
          lines = path.read_text().splitlines()
          matches = [i for i, line in enumerate(lines)
                     if line.startswith("export KBUILD_EXT_MODULES=")]
          if len(matches) != 1:
              raise SystemExit("Expected exactly one KBUILD_EXT_MODULES export")
          lines[matches[0]] = (
              'export KBUILD_EXT_MODULES="../vendor/qcom/opensource/wlan/qcacld-3.0"'
          )
          lines = [line for line in lines if line != "export MODNAME=audio_dlkm"]
          path.write_text("\n".join(lines) + "\n")
          PY

          mkdir -p out/vendor/qcom/opensource/mmrm-driver/
          touch out/vendor/qcom/opensource/mmrm-driver/Module.symvers

          bash build_kernel_GKI.sh

          MODULE="$(find out -type f -path '*/dist/*' -name wlan.ko -print -quit)"
          if [ -z "$MODULE" ]; then
            MODULE="$(find out -type f -name wlan.ko -print -quit)"
          fi
          if [ -z "$MODULE" ]; then
            echo "wlan.ko was not produced"
            find out -type f -name '*.ko' -print | head -100
            exit 1
          fi

          cp "$MODULE" "$GITHUB_WORKSPACE/wlan.ko"
          ls -lh "$GITHUB_WORKSPACE/wlan.ko"

      - name: Upload wlan.ko
        uses: actions/upload-artifact@v4
        with:
          name: qcacld3-wlan-ko
          path: wlan.ko
          if-no-files-found: error
          compression-level: 0
